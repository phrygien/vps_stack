http:
  routers:
    catchall:
      rule: "HostRegexp(`{host:.+}`)"
      priority: 1
      service: noop@internal
      entryPoints:
        - web
        - websecure

  middlewares:
    secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"

    rate-limit:
      rateLimit:
        average: 100
        burst: 50

    compress:
      compress: {}
