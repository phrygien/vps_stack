version: "3.9"

networks:
  traefik-public:
    external: true
  api-auctav-net:
    external: true
  cosmia-net:
    external: true
  api-cosmia-net:
    external: true
  central-stock-net:
    external: true

services:
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      - TZ=Europe/Paris
      - PMA_HOSTS=api-auctav-mysql,cosmia-mysql,mysql-api-cosmia, central-stk-server
      - PMA_ABSOLUTE_URI=https://phpadmin.astucom.com/
      - UPLOAD_LIMIT=64M
    networks:
      - traefik-public
      - api-auctav-net
      - cosmia-net
      - api-cosmia-net
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.phpmyadmin.rule=Host(`phpadmin.astucom.com`)
      - traefik.http.routers.phpmyadmin.entrypoints=websecure
      - traefik.http.routers.phpmyadmin.tls.certresolver=letsencrypt
      - traefik.http.routers.phpmyadmin.middlewares=phpmyadmin-auth
      - traefik.http.services.phpmyadmin.loadbalancer.server.port=80
      - traefik.http.middlewares.phpmyadmin-auth.basicauth.users=${DASHBOARD_AUTH}
